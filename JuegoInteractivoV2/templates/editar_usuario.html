<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar Perfil · Innova</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  select.opcion-btn:hover {
    background: var(--paper) !important;
    color: var(--ink) !important;
  }
</style>
</head>
<body>
  <div class="mision-card">
    <h2 class="inicio-titulo" style="text-align: center; margin-bottom: 20px;">Editar Perfil</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="color: var(--bad); text-align: center; margin-bottom: 15px; font-weight: bold;">
        {% for message in messages %}
          {{ message }}
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('editar_usuario', usuario_id=usuario.id) }}" class="opciones" autocomplete="off">
      <input type="text" name="nombre" class="opcion-btn" placeholder="Nombre completo" value="{{ usuario.nombre }}" required>
      <input type="text" name="rut" class="opcion-btn" placeholder="RUT" value="{{ usuario.rut or '' }}">
      <input type="text" name="usuario" class="opcion-btn" placeholder="Nombre de usuario" value="{{ usuario.usuario }}" required>
      <input type="password" name="password" class="opcion-btn" placeholder="Nueva contraseña (dejar en blanco para no cambiarla)" autocomplete="new-password">

      <select name="rol_cuenta" class="opcion-btn" required style="appearance: auto; background: var(--paper);">
        <option value="practicante" {{ 'selected' if usuario.rol_cuenta == 'practicante' }}>Practicante (Nuevo Ingreso)</option>
        <option value="trabajador" {{ 'selected' if usuario.rol_cuenta == 'trabajador' }}>Trabajador (Equipo)</option>
        <option value="jefe" {{ 'selected' if usuario.rol_cuenta == 'jefe' }}>Líder de Equipo / Jefe</option>
        <option value="admin" {{ 'selected' if usuario.rol_cuenta == 'admin' }}>Administrador</option>
      </select>

      <button type="submit" class="btn-reto-final" style="margin-top: 15px; width: 100%;">Guardar Cambios</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="{{ url_for('usuarios') }}" class="btn-reto-final" style="display: block; background: var(--steel); color: white;">Volver a Usuarios</a>
    </div>
  </div>
</body>
</html>
